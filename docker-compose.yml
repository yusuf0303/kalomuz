version: '3.8'

services:
  app:
    image: laravelsail/php83-composer
    container_name: kalomuz-app
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=kalomuz_db
      - DB_USERNAME=kalomuz
      - DB_PASSWORD=kalomuz
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: kalomuz-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kalomuz_db
      MYSQL_ROOT_PASSWORD: kalomuz
      MYSQL_USER: kalomuz
      MYSQL_PASSWORD: kalomuz
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:

